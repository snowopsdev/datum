name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: this workflow only checks out code and runs local
# tests/lint, it never writes back to the repo, comments, or publishes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOCK_MODE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (cms)
        run: npm run lint
      - name: Test pipeline
        run: npm test --workspace pipeline

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datum
          POSTGRES_PASSWORD: datum
          POSTGRES_DB: datum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datum -d datum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://datum:datum@127.0.0.1:5432/datum
      PAYLOAD_SECRET: ci-payload-secret-not-for-production
      MOCK_MODE: 'true'
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Migrate cms database
        run: npm run payload --workspace cms -- migrate
      - name: Test cms integration
        run: npm run test:int --workspace cms

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datum
          POSTGRES_PASSWORD: datum
          POSTGRES_DB: datum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datum -d datum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://datum:datum@127.0.0.1:5432/datum
      PAYLOAD_SECRET: ci-payload-secret-not-for-production
      MOCK_MODE: 'true'
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Migrate cms database
        run: npm run payload --workspace cms -- migrate
      - name: Build cms
        run: npm run build --workspace cms

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [static, integration, build]
    if: always()
    steps:
      - name: Require all checks to succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$BUILD_RESULT" = success
