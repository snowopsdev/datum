name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default: this workflow only checks out code and runs local
# tests/lint, it never writes back to the repo, comments, or publishes.
permissions:
  contents: read

# A newer push supersedes an older run on the same pull request. Runs on main
# are never cancelled: two merges landing close together each keep their check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOCK_MODE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (cms)
        run: npm run lint
      - name: Test pipeline
        run: npm test --workspace pipeline

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datum
          POSTGRES_PASSWORD: datum
          POSTGRES_DB: datum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datum -d datum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite refuses a database whose name has no "test" in it.
      DATABASE_URL: postgresql://datum:datum@127.0.0.1:5432/datum_test
      PAYLOAD_SECRET: ci-payload-secret-not-for-production
      MOCK_MODE: 'true'
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Migrate cms database
        run: npm run payload --workspace cms -- migrate
      - name: Test cms integration
        run: npm run test:int --workspace cms

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datum
          POSTGRES_PASSWORD: datum
          POSTGRES_DB: datum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datum -d datum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Playwright starts its own dev server from this environment, and refuses
      # a database whose name has no "test" in it.
      DATABASE_URL: postgresql://datum:datum@127.0.0.1:5432/datum_test
      PAYLOAD_SECRET: ci-payload-secret-not-for-production
      MOCK_MODE: 'true'
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Migrate cms database
        run: npm run payload --workspace cms -- migrate
      # The specs need the templates (several of them), the demo workspace
      # assets and the admin user that the seed installs.
      - name: Seed cms database
        run: npm run seed --workspace cms
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Test cms end to end
        run: npm run test:e2e --workspace cms
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            cms/playwright-report/
            cms/test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datum
          POSTGRES_PASSWORD: datum
          POSTGRES_DB: datum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datum -d datum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://datum:datum@127.0.0.1:5432/datum
      PAYLOAD_SECRET: ci-payload-secret-not-for-production
      MOCK_MODE: 'true'
      NODE_OPTIONS: --no-deprecation

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Migrate cms database
        run: npm run payload --workspace cms -- migrate
      - name: Build cms
        run: npm run build --workspace cms

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [static, integration, e2e, build]
    if: always()
    steps:
      - name: Require all checks to succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$E2E_RESULT" = success
          test "$BUILD_RESULT" = success
