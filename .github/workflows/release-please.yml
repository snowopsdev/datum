name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Queue runs instead of overlapping: two pushes to main in quick succession
# would otherwise race to update the same release PR. Never cancel — a
# half-finished run could leave a tag without its GitHub release.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          # Optional RELEASE_PLEASE_TOKEN (fine-grained PAT): release PRs opened with
          # the default GITHUB_TOKEN don't trigger CI, so required checks never run
          # on them. See RELEASING.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
