      <text x="776" y="300" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVED ONCE</text>
      <rect x="746" y="500" width="60" height="12" rx="2" fill="#f7f7f5"/>
      <text x="776" y="508" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECORDS</text>
      <rect x="632" y="46" width="184" height="12" rx="2" fill="#f7f7f5"/>
      <text x="724" y="54" fill="#171717" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SOURCE REVIEW — A PERSON RATES IT</text>
      <text x="96" y="300" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">GATE — A RUN REFUSES TO START WITHOUT THESE THREE</text>

