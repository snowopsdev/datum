      <text x="604" y="420" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">all five prompt blocks</text>

      <rect x="736" y="368" width="200" height="72" rx="8" fill="#f7f7f5"/>
