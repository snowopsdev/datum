      <line x1="720" y1="272" x2="720" y2="328" stroke="#666666" stroke-width="1.2" marker-end="url(#inputs-arrow)"/>
      <line x1="720" y1="480" x2="720" y2="536" stroke="#666666" stroke-width="1.2" marker-end="url(#inputs-arrow)"/>
