      <text x="356" y="614" fill="#171717" font-size="10" font-weight="500" font-family="'Geist Mono', monospace">article-audit</text>
      <text x="356" y="632" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">every stage advance</text>

      <rect x="600" y="588" width="240" height="56" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1"/>
      <text x="612" y="614" fill="#171717" font-size="10" font-weight="500" font-family="'Geist Mono', monospace">cost-log</text>
      <text x="612" y="632" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">every model call that parsed</text>

      <rect x="856" y="588" width="240" height="56" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1"/>
      <text x="868" y="614" fill="#171717" font-size="10" font-weight="500" font-family="'Geist Mono', monospace">information-gain-runs</text>
