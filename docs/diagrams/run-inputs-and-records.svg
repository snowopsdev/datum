      <!-- The run -->
      <rect x="240" y="328" width="960" height="152" rx="8" fill="#171717" opacity="0.018"/>
      <rect x="240" y="328" width="960" height="152" rx="8" fill="none" stroke="#8a8a8a" stroke-width="0.8" stroke-dasharray="4,4"/>
