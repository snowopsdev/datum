<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="780" viewBox="0 0 1440 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="run-inputs-title run-inputs-desc">
      <title id="run-inputs-title">What a run reads and writes</title>
      <desc id="run-inputs-desc">A pipeline run resolves its workspace data when it starts rather than per article, and three of those assets must be set or the run refuses to start. The four stages share that workspace data, re-reading only the template attached to each article, and write five kinds of record as they go, three of them append-only, while the CMS writes three more around them. Unrated domains cited during scoring land in a review queue, and rating one there feeds the next run.</desc>
