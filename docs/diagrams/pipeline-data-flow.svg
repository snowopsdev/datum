      <rect x="156" y="132" width="24" height="12" rx="2" fill="#171717"/>
      <text x="168" y="141" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">INT</text>
      <text x="200" y="156" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider seam</text>
      <text x="200" y="172" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AhrefsClient</text>
      <text x="200" y="184" fill="#171717" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">INSERT HERE</text>

      <!-- Automated pipeline nodes -->
      <g font-family="'Geist', sans-serif" text-anchor="middle">
        <rect x="148" y="204" width="104" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1"/>
        <rect x="156" y="212" width="24" height="12" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/>
        <text x="168" y="221" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">PIP</text>
        <text x="200" y="236" fill="#171717" font-size="12" font-weight="600">Fetch topics</text>
        <text x="200" y="252" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">topic_selected</text>
        <text x="200" y="264" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace">Payload write</text>

        <rect x="260" y="204" width="104" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1"/>
        <rect x="268" y="212" width="24" height="12" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/>
        <text x="280" y="221" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">PIP</text>
        <text x="312" y="236" fill="#171717" font-size="12" font-weight="600">Research</text>
        <text x="312" y="252" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">SERP + questions</text>
        <text x="312" y="264" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace">researched</text>

        <rect x="372" y="204" width="104" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1"/>
        <rect x="380" y="212" width="24" height="12" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/>
        <text x="392" y="221" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">PIP</text>
        <text x="424" y="236" fill="#171717" font-size="12" font-weight="600">Generate</text>
        <text x="424" y="252" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">draft + SEO</text>
        <text x="424" y="264" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace">Anthropic / mock</text>

        <rect x="484" y="204" width="104" height="64" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1"/>
        <rect x="492" y="212" width="24" height="12" rx="2" fill="none" stroke="#666666" stroke-width="0.8"/>
        <text x="504" y="221" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">PIP</text>
        <text x="536" y="236" fill="#171717" font-size="12" font-weight="600">QA gates</text>
        <text x="536" y="252" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">structure + 2 reviews</text>
        <text x="536" y="264" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace">pass / revise</text>
      </g>

      <!-- Editor and reader nodes -->
      <rect x="596" y="284" width="104" height="64" rx="8" fill="#ffffff" stroke="#171717" stroke-width="1"/>
      <rect x="604" y="292" width="24" height="12" rx="2" fill="none" stroke="#171717" stroke-width="0.8"/>
      <text x="616" y="301" fill="#171717" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">EDT</text>
      <text x="648" y="316" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Editor review</text>
      <text x="648" y="332" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">approve / revise</text>
      <text x="648" y="344" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Payload admin</text>

      <rect x="708" y="284" width="104" height="64" rx="8" fill="#171717" stroke="#171717" stroke-width="1.2"/>
      <rect x="716" y="292" width="24" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="0.8"/>
      <text x="728" y="301" fill="#ffffff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WEB</text>
      <text x="760" y="316" fill="#ffffff" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Public reader</text>
      <text x="760" y="332" fill="#d8d8d4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">published article</text>
      <text x="760" y="344" fill="#d8d8d4" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">canonical page</text>

      <!-- Legend and integration annotation -->
      <text x="20" y="376" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">INTEGRATION</text>
      <rect x="144" y="364" width="16" height="16" rx="4" fill="#e4e4e0" stroke="#171717" stroke-width="1.2"/>
      <text x="172" y="376" fill="#171717" font-size="8" font-weight="600" font-family="'Geist Mono', monospace">IMPLEMENT AhrefsClient + INJECT THROUGH StageContext</text>

      <text x="20" y="404" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">STATE</text>
      <text x="144" y="404" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">EVERY STAGE READS / WRITES PAYLOAD + POSTGRES; AUDIT AND COST LOGS STAY DURABLE</text>

      <text x="20" y="432" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">FLOW</text>
      <line x1="144" y1="428" x2="176" y2="428" stroke="#171717" stroke-width="1.2" marker-end="url(#pipeline-arrow-accent)"/>
      <text x="188" y="432" fill="#171717" font-size="8" font-family="'Geist Mono', monospace">INTEGRATION SEAM</text>
      <line x1="332" y1="428" x2="364" y2="428" stroke="#666666" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
      <text x="376" y="432" fill="#666666" font-size="8" font-family="'Geist Mono', monospace">PIPELINE</text>
      <line x1="468" y1="428" x2="500" y2="428" stroke="#444444" stroke-width="1.2" marker-end="url(#pipeline-arrow-link)"/>
      <text x="512" y="432" fill="#444444" font-size="8" font-family="'Geist Mono', monospace">PUBLICATION</text>
    </svg>
