        <rect x="184" y="4" width="32" height="16" rx="8" fill="#171717"/>
        <text x="200" y="16" fill="#ffffff">01</text>
        <text x="200" y="32" fill="#171717" font-weight="600">INTEGRATE</text>

        <rect x="296" y="4" width="32" height="16" rx="8" fill="#171717" opacity="0.12"/>
        <text x="312" y="16" fill="#171717">02</text>
        <text x="312" y="32" fill="#666666">RESEARCH</text>

        <rect x="408" y="4" width="32" height="16" rx="8" fill="#171717" opacity="0.12"/>
        <text x="424" y="16" fill="#171717">03</text>
        <text x="424" y="32" fill="#666666">DRAFT</text>

        <rect x="520" y="4" width="32" height="16" rx="8" fill="#171717" opacity="0.12"/>
        <text x="536" y="16" fill="#171717">04</text>
        <text x="536" y="32" fill="#666666">QA</text>

        <rect x="632" y="4" width="32" height="16" rx="8" fill="#171717" opacity="0.12"/>
        <text x="648" y="16" fill="#171717">05</text>
        <text x="648" y="32" fill="#666666">REVIEW</text>

        <rect x="744" y="4" width="32" height="16" rx="8" fill="#171717" opacity="0.12"/>
        <text x="760" y="16" fill="#171717">06</text>
        <text x="760" y="32" fill="#666666">PUBLISH</text>
      </g>

