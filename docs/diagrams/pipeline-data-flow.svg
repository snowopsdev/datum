<?xml version="1.0" encoding="UTF-8"?>
<svg width="1520" height="720" viewBox="0 0 1520 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-data-flow-title pipeline-data-flow-desc">
      <title id="pipeline-data-flow-title">Datum pipeline and data integration seam</title>
      <desc id="pipeline-data-flow-desc">External keyword data enters through the AhrefsClient provider seam and the open web supplies competitor pages and search results, feeding a run that fetches topics, researches, writes, checks and scores an article. Every model call is routed through one provider adapter chosen from the model id. The run pauses twice for a person: once to approve the brief before writing is paid for, and once to review the finished draft before it is published.</desc>
