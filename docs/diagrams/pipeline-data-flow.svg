<?xml version="1.0" encoding="UTF-8"?>
<svg width="844" height="456" viewBox="0 0 844 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-data-flow-title pipeline-data-flow-desc">
      <title id="pipeline-data-flow-title">Datum pipeline and data integration seam</title>
      <desc id="pipeline-data-flow-desc">External SEO data enters through the highlighted AhrefsClient provider seam, then moves through topic discovery, research, generation, quality checks, editor review, and the public article reader.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#666666"/>
        </marker>
        <marker id="pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#171717"/>
        </marker>
        <marker id="pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#444444"/>
        </marker>
      </defs>

      <rect width="844" height="456" fill="#f7f7f5"/>
      <rect x="0" y="36" width="844" height="80" fill="#171717" opacity="0.018"/>
      <rect x="0" y="196" width="844" height="80" fill="#171717" opacity="0.018"/>

      <!-- Lane and legend structure -->
      <line x1="0" y1="36" x2="844" y2="36" stroke="#c8c8c4" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="844" y2="116" stroke="#c8c8c4" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="844" y2="196" stroke="#c8c8c4" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="844" y2="276" stroke="#c8c8c4" stroke-width="0.8"/>
      <line x1="0" y1="356" x2="844" y2="356" stroke="#c8c8c4" stroke-width="0.8"/>
      <line x1="144" y1="36" x2="144" y2="356" stroke="#c8c8c4" stroke-width="0.8"/>

      <!-- Flow connectors are drawn before nodes. -->
      <line x1="200" y1="108" x2="200" y2="124" stroke="#171717" stroke-width="1.2" marker-end="url(#pipeline-arrow-accent)"/>
      <line x1="200" y1="188" x2="200" y2="204" stroke="#666666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pipeline-arrow)"/>
      <line x1="252" y1="236" x2="260" y2="236" stroke="#666666" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
      <line x1="364" y1="236" x2="372" y2="236" stroke="#666666" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
      <line x1="476" y1="236" x2="484" y2="236" stroke="#666666" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
      <path d="M 588 236 H 640 Q 648 236 648 244 V 284" fill="none" stroke="#666666" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
      <line x1="700" y1="316" x2="708" y2="316" stroke="#444444" stroke-width="1.2" marker-end="url(#pipeline-arrow-link)"/>

      <!-- The only flow label marks the cross-role integration handoff. -->
      <rect x="220" y="108" width="56" height="12" rx="2" fill="#f7f7f5"/>
      <text x="248" y="116" fill="#171717" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEO DATA</text>

      <!-- Step headers -->
