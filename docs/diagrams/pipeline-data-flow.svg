      <g fill="#666666" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">
        <text x="72" y="72">EXTERNAL</text><text x="72" y="84">DATA</text>
        <text x="72" y="152">INTEGRATION</text><text x="72" y="164">CONTRACT</text>
        <text x="72" y="232">AUTOMATED</text><text x="72" y="244">PIPELINE</text>
        <text x="72" y="312">EDITOR +</text><text x="72" y="324">READER</text>
      </g>

      <!-- Source node -->
      <rect x="148" y="44" width="104" height="64" rx="8" fill="#ffffff"/>
      <rect x="148" y="44" width="104" height="64" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1"/>
      <rect x="156" y="52" width="24" height="12" rx="2" fill="none" stroke="#8a8a8a" stroke-width="0.8"/>
      <text x="168" y="61" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SRC</text>
      <text x="200" y="76" fill="#171717" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SEO sources</text>
      <text x="200" y="92" fill="#666666" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Ahrefs today</text>
      <text x="200" y="104" fill="#8a8a8a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">future providers</text>

